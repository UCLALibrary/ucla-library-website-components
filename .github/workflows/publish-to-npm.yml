name: Release

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PAT_SEMENTIC_RELEASE_AND_ESLINT }}

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org/

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release Vue Component Library
        id: vue_release
        uses: cycjimmy/semantic-release-action@v6
        with:
          working_directory: packages/vue-component-library
          semantic_version: 24.2.9
          extends: semantic-release-monorepo
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_SEMENTIC_RELEASE_AND_ESLINT }}

      - name: Publish Vue Component Library
        id: vue_publish
        if: steps.vue_release.outputs.new_release_published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter @ucla-library-monorepo/ucla-library-website-components publish \
            --no-git-checks --access public

      - name: Force Commit in Nuxt Module
        if: steps.vue_publish.conclusion == 'success'
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"

          # Include any release commit already pushed by semantic-release.
          git fetch origin main
          git merge --ff-only origin/main

          # Create the Nuxt patch-release trigger.
          echo "Triggered release at $(date)" > packages/component-library-nuxt-module/FORCE_RELEASE.txt

          git add packages/component-library-nuxt-module/FORCE_RELEASE.txt

          git commit -m "fix(nuxt-module): force release after vue-component-library update [skip ci]"

          git remote set-url origin "https://x-access-token:${{ secrets.PAT_SEMENTIC_RELEASE_AND_ESLINT }}@github.com/${{ github.repository }}.git"

          git push origin HEAD:main

      - name: Release Nuxt Module
        id: nuxt_release
        uses: cycjimmy/semantic-release-action@v6
        with:
          working_directory: packages/component-library-nuxt-module
          semantic_version: 24.2.9
          extends: semantic-release-monorepo
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_SEMENTIC_RELEASE_AND_ESLINT }}

      - name: Publish Nuxt Module
        if: steps.nuxt_release.outputs.new_release_published == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter @ucla-library-monorepo/ucla-library-website-components build

          pnpm --filter @ucla-library/component-library-nuxt-module publish \
            --no-git-checks --access public
