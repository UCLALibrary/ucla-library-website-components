name: Debug Release Authentication

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-release:
    name: Test Release Automation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org/

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TEST 1: Vue Component Library semantic-release
      - name: Test Vue semantic-release
        id: vue_release
        uses: cycjimmy/semantic-release-action@v6
        with:
          working_directory: packages/vue-component-library
          semantic_version: 24.2.9
          extends: semantic-release-monorepo
          branches: '["test-release-automation"]'
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_SEMENTIC_RELEASE_AND_ESLINT }}

      # TEST 2: Simulate the Nuxt force commit locally
      # No git push is performed.
      - name: Simulate Nuxt force commit locally
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions Test"
          git config user.email "github-actions@github.com"

          echo "Release automation test $GITHUB_RUN_ID" \
            > packages/component-library-nuxt-module/FORCE_RELEASE.txt

          git add packages/component-library-nuxt-module/FORCE_RELEASE.txt

          git commit -m "fix(nuxt-module): test release synchronization"

          echo "Temporary local commit created:"
          git log -1 --format='%h %s'

      # TEST 3: Nuxt Module semantic-release
      - name: Test Nuxt semantic-release
        id: nuxt_release
        uses: cycjimmy/semantic-release-action@v6
        with:
          working_directory: packages/component-library-nuxt-module
          semantic_version: 24.2.9
          extends: semantic-release-monorepo
          branches: '["test-release-automation"]'
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_SEMENTIC_RELEASE_AND_ESLINT }}

      # TEST 4: Display results
      - name: Display Release Test Results
        if: always()
        env:
          VUE_RESULT: ${{ steps.vue_release.outputs.new_release_published }}
          VUE_VERSION: ${{ steps.vue_release.outputs.new_release_version }}
          VUE_TAG: ${{ steps.vue_release.outputs.new_release_git_tag }}
          NUXT_RESULT: ${{ steps.nuxt_release.outputs.new_release_published }}
          NUXT_VERSION: ${{ steps.nuxt_release.outputs.new_release_version }}
          NUXT_TAG: ${{ steps.nuxt_release.outputs.new_release_git_tag }}
        run: |
          {
            echo "## Release Automation Dry-Run Results"
            echo ""
            echo "| Package | Release output | Version | Tag |"
            echo "|---|---|---|---|"
            echo "| Vue Component Library | ${VUE_RESULT:-N/A} | ${VUE_VERSION:-N/A} | ${VUE_TAG:-N/A} |"
            echo "| Nuxt Module | ${NUXT_RESULT:-N/A} | ${NUXT_VERSION:-N/A} | ${NUXT_TAG:-N/A} |"
            echo ""
            echo "Dry-run only: no npm publication or Git push."
          } >> "$GITHUB_STEP_SUMMARY"
